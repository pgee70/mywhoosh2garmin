name: Build & Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            cc: gcc
            build_output: mywhoosh2garmin-linux-amd64
            artifact: mywhoosh2garmin-linux-amd64
          - os: ubuntu-latest
            goos: windows
            goarch: amd64
            cc: x86_64-w64-mingw32-gcc
            build_output: mywhoosh2garmin-windows-amd64.exe
            artifact: mywhoosh2garmin-windows-amd64.exe
          - os: macos-latest
            goos: darwin
            goarch: arm64
            cc: clang
            build_output: mywhoosh2garmin
            artifact: MyWhoosh2Garmin-macos-arm64.app.zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install Linux build deps
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl-dev xorg-dev libxxf86vm-dev

      - name: Install mingw-w64 (for Windows cross-compile)
        if: matrix.goos == 'windows'
        run: sudo apt-get install -y mingw-w64

      - name: Build
        env:
          CGO_ENABLED: 1
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc }}
        run: |
          LDFLAGS="-s -w"
          if [ "$GOOS" = "windows" ]; then
            LDFLAGS="$LDFLAGS -H=windowsgui"
          fi
          go build -ldflags "$LDFLAGS" -o "${{ matrix.build_output }}" .

      - name: Package macOS app bundle
        if: matrix.goos == 'darwin'
        run: |
          APP_NAME="MyWhoosh2Garmin.app"
          VERSION="${GITHUB_REF_NAME:-dev}"
          VERSION="${VERSION#v}"

          mkdir -p "$APP_NAME/Contents/MacOS"
          cat > "$APP_NAME/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>MyWhoosh2Garmin</string>
            <key>CFBundleDisplayName</key>
            <string>MyWhoosh2Garmin</string>
            <key>CFBundleIdentifier</key>
            <string>com.pgee70.mywhoosh2garmin</string>
            <key>CFBundleVersion</key>
            <string>${GITHUB_RUN_NUMBER}</string>
            <key>CFBundleShortVersionString</key>
            <string>${VERSION}</string>
            <key>CFBundleExecutable</key>
            <string>mywhoosh2garmin</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>LSMinimumSystemVersion</key>
            <string>12.0</string>
          </dict>
          </plist>
          EOF

          cp "${{ matrix.build_output }}" "$APP_NAME/Contents/MacOS/mywhoosh2garmin"
          chmod +x "$APP_NAME/Contents/MacOS/mywhoosh2garmin"

      - name: Package unsigned macOS app
        if: matrix.goos == 'darwin'
        run: |
          APP_NAME="MyWhoosh2Garmin.app"
          APP_ZIP="${{ matrix.artifact }}"
          ditto -c -k --sequesterRsrc --keepParent "$APP_NAME" "$APP_ZIP"

      - name: Upload Linux/Windows artifact
        if: matrix.goos != 'darwin'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.build_output }}

      - name: Upload macOS app artifact
        if: matrix.goos == 'darwin'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/mywhoosh2garmin-linux-amd64/mywhoosh2garmin-linux-amd64
            artifacts/mywhoosh2garmin-windows-amd64.exe/mywhoosh2garmin-windows-amd64.exe
            artifacts/MyWhoosh2Garmin-macos-arm64.app.zip/MyWhoosh2Garmin-macos-arm64.app.zip
